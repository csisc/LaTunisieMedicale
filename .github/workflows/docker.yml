version: "3.9"

services:
  app:
    container_name: latunisie-medicale-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
    command: npm run dev
    stdin_open: true
    tty: true
